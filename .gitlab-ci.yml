stages:
  - build
  - test
  - deploy

variables:
  VERSION: "1.0"
  APP_NAME: "ehel-product-service"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

build_executable:
  stage: build
  image: maven:latest
  script:
    - mkdir -p build
    - mvn clean package
    - cp "target/$APP_NAME-$VERSION.jar" build/
  artifacts:
    paths:
      - build/

build_image:
  stage: build
  image: docker:24-cli
  script:
    - echo "Building the image..."
    - mkdir -p build
    - docker build -t "$APP_NAME:$VERSION" .
    - docker save -o "build/$APP_NAME-$VERSION.tar" "$APP_NAME:$VERSION"
  artifacts:
    paths:
      - build/

test_job:
  stage: test
  image: maven:latest
  script:
    - echo "Unit testing..."
    - mvn test
    - echo "Integration testing..."
    - mvn failsafe:integration-test

deploy_job:
  stage: deploy
  image: docker:24-
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker tag "$APP_NAME:$VERSION" "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
